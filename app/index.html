<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Vetro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="$WEBAPIS/webapis/webapis.js"></script>
<style>
/* Values from design-system/tokens.css (dark), status colours from the dashboard. Static page: solid surfaces,
   no blur, no animation. Flex without gap and ES5 only, so older TV runtimes draw it the same. */
:root{--bg:#080f23;--surface:#101c35;--raised:#192943;--text:#f5f8ff;--muted:#aab8d1;--border:#344360;--link:#8fbaff;
--ok:rgb(127,203,160);--warn:rgb(226,184,103);--bad:rgb(239,138,128);
--ok-soft:rgba(127,203,160,.12);--warn-soft:rgba(226,184,103,.12);--bad-soft:rgba(239,138,128,.12);
--ok-line:rgba(127,203,160,.4);--warn-line:rgba(226,184,103,.4);--bad-line:rgba(239,138,128,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.safe{position:absolute;top:54px;left:96px;right:96px;bottom:54px}
.hero{display:flex;align-items:center}
.hero img{width:176px;height:176px;border-radius:28px;display:block;flex:none;margin-right:48px}
.hero h1{margin:0;font-size:84px;line-height:1.05;font-weight:500;letter-spacing:-.04em}
.meta{margin-top:12px;font-size:28px;color:var(--muted)}
.state{margin-top:20px;display:inline-flex;align-items:center;font-size:28px;font-weight:500;padding:8px 20px 8px 12px;border-radius:999px;border:2px solid var(--ok-line);background:var(--ok-soft);color:var(--ok)}
.state svg{width:32px;height:32px;margin-right:12px;flex:none}
.state.warn{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.state.bad{border-color:var(--bad-line);background:var(--bad-soft);color:var(--bad)}
.state.wait{border-color:var(--border);background:transparent;color:var(--muted)}
/* The one moving thing: a slowly turning dashed ring while the checks run, so a quiet screen does not look stuck. */
@keyframes spin{to{transform:rotate(360deg)}}
.state.wait svg,.c.wait .ic{animation:spin 2.4s linear infinite}
.dash{margin-left:auto;align-self:stretch;display:flex;flex-direction:column;justify-content:center;width:760px;padding:28px 36px;border-radius:16px;background:var(--surface);border:2px solid var(--border)}
.dh{display:flex;align-items:baseline}
.dh small{font-size:22px;letter-spacing:.12em;color:var(--muted)}
/* The sign-in code: hidden, and the card does not move, until a browser asks to pair. */
.pin{margin-left:auto;font-size:22px;letter-spacing:.12em;color:var(--muted)}
.pin i{display:block;margin-top:4px;font-size:20px;font-style:normal;letter-spacing:0;text-align:right;color:var(--muted)}
.pin b{margin-left:12px;font-family:monospace;font-size:30px;letter-spacing:.2em;color:var(--text)}
.url{margin:10px 0 8px;font-family:monospace;font-size:44px;font-weight:500;color:var(--link);white-space:nowrap}
.url.off{color:var(--muted)}
.dash p{margin:0;font-size:24px;line-height:1.35;color:var(--muted)}
.panel{position:absolute;left:0;right:0;bottom:0;padding:32px 36px 28px;border-radius:16px;background:var(--surface);border:2px solid var(--border)}
.panel.bad{border-color:var(--bad-line)}.panel.warn{border-color:var(--warn-line)}
.ph{display:flex;align-items:center;margin-bottom:24px}
.ph h2{margin:0;font-size:36px;font-weight:500;letter-spacing:-.02em}
.sum{margin-left:auto;font-size:26px;font-weight:500;color:var(--ok)}
.sum.warn{color:var(--warn)}.sum.bad{color:var(--bad)}.sum.wait{color:var(--muted)}
.grid{display:flex;flex-wrap:wrap}
.c{display:flex;width:calc(33.333% - 11px);margin:0 16px 16px 0;padding:20px 22px;border-radius:12px;background:var(--raised);border:2px solid transparent;min-height:112px}
.c:nth-child(3n){margin-right:0}
.c.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.c.bad{background:var(--bad-soft);border-color:var(--bad-line)}
.c.na{opacity:.6}
.c.wait{background:transparent;border-color:var(--border)}.c.wait .v{color:var(--muted);font-weight:400}
.ic{flex:none;width:40px;height:40px;margin-right:18px}
.n{font-size:26px;line-height:1.2;color:var(--muted)}
.v{margin-top:2px;font-size:30px;line-height:1.2;font-weight:500}
.v span{font-weight:400;color:var(--muted);font-size:24px}
.c.warn .v{color:var(--warn)}.c.bad .v{color:var(--bad)}
.h{margin-top:8px;font-size:23px;line-height:1.35}
.share{display:flex;align-items:center;margin-top:4px;padding-top:20px;border-top:2px solid var(--border)}
.share .t{font-size:22px;color:var(--muted);flex:none;width:250px;margin-right:24px;line-height:1.3}
.share code{font-family:monospace;font-size:22px;word-break:break-word;line-height:1.4}
.share em{font-style:normal;color:var(--bad);font-weight:700}.share em.w{color:var(--warn)}
.keys{display:flex;justify-content:flex-end;margin-top:18px;font-size:22px;color:var(--muted)}
.keys span{margin-left:28px}
.keys i{font-style:normal;display:inline-block;margin-right:10px;padding:2px 12px;border:2px solid var(--border);border-radius:8px;color:var(--text)}
</style></head>
<body>
<div id="stage"><div class="safe" id="screen"></div></div>
<script>
var BASE = 'http://127.0.0.1:8099';
var ICON = 'icon.png';
var IDLE_MS = 300000;
var report = {probe: {}, apps: [], packages: [], settings: {}};
var delivered = false, running = false, idleTimer = null, fullCheck = false;
var leaving = false, screenEpoch = 0, screenTasks = [], pairingTimer = null, pairingTick = null, screenTimer = null;
var liveBusy = false, pairingBusy = false, liveError = false;
function trackScreenTask(cancel) {
  screenTasks.push(cancel);
  return function () { var i = screenTasks.indexOf(cancel); if (i !== -1) screenTasks.splice(i, 1); };
}
function screenRequest(method, route, body, timeout) {

    if (leaving) return reject(new Error('Screen is closing'));
    var xhr = new XMLHttpRequest(), done = false;
    var forget = trackScreenTask(function () { finish(new Error('Screen is closing')); try { xhr.abort(); } catch (e) {} });

        try { finish(null, JSON.parse(xhr.responseText)); } catch (e) { var invalid = new Error('Response is not JSON'); invalid.status = xhr.status; finish(invalid); }

}
// The whole check stops after TOTAL_MS even if a step is stuck (every step also has its own limit).
var TOTAL_MS = 100000;
var step = null, tick = null, posts = Promise.resolve(), lastScreen = null, packagesBusy = false, packagesAgain = false;
// Dashboard sign-in: the service asks for a 6-digit code that only this screen shows (see service/auth.js).
var pairing = null;
// The service keeps running without this page; a resident page only holds memory.
function startPolling() {
  pairingTimer = setInterval(checkPairing, 2000);
  pairingTick = setInterval(function () { if (!leaving && pairing) paintPairing(); }, 1000);
  screenTimer = setInterval(pollScreen, 5000);
}
function leave() {
  if (leaving) return;
  leaving = true; screenEpoch++;
  clearTimeout(idleTimer); clearInterval(tick);
  clearInterval(pairingTimer); clearInterval(pairingTick); clearInterval(screenTimer);
  screenTasks.slice().forEach(function (cancel) { cancel(); });

  catch (e) { leaving = false; startPolling(); resetIdle(); }
}
// Every probe gets a time limit: a Tizen call whose callback never fires must not leave the screen on "Checking".
function attempt(name, fn, limit) {
  return new Promise(function (resolve) {
    if (leaving) return resolve();
    var epoch = screenEpoch, mine = report;
    var done = false, timer = setTimeout(function () { finish({ok: false, error: 'no answer in ' + Math.round((limit || 8000) / 1000) + ' s'}); }, limit || 8000);
    var forget = trackScreenTask(function () { finish(null); });
    function finish(r) { if (done) return; done = true; clearTimeout(timer); forget(); if (!leaving && epoch === screenEpoch && mine === report && r) report.probe[name] = r; resolve(); }
    try {
      Promise.resolve(fn()).then(function (v) { finish({ok: true, value: v}); },
        function (e) { finish({ok: false, error: String(e && e.message || e)}); });
    } catch (e) { finish({ok: false, error: String(e && e.message || e)}); }
  });
}
// A public-level certificate may not get the on-boot start honored, so the page starts the service itself.
function launchService() {
  return screenRequest('GET', '/status', undefined, 1000).then(function () { return 'already running'; }, function (error) {
    if (leaving || error.status) throw error;
    return cb(function (ok, ko) {
    function failed(e) { ko(new Error('launch failed (wrt:service: ' + (e && e.message || e) + ')')); }
    if (typeof window.a2sService === 'function') {
      try { Promise.resolve(new window.a2sService('vetrotvapp.svc').start()).then(ok, failed); }
      catch (e) { failed(e); }
      return;
    }
    tizen.application.launch('vetrotvapp.svc', ok, ko);
    });
  });
}
function reach(tries) {
  return screenRequest('GET', '/status', undefined, 4000).then(function () { return 200; }, function (error) {
    if (leaving || error.status || tries <= 1) throw error;

      var timer = setTimeout(done, 1500), forget = trackScreenTask(done), settled = false;
      function done() { if (settled) return; settled = true; clearTimeout(timer); forget(); resolve(); }
    }).then(function () { if (!leaving) return reach(tries - 1); });
  });
}
function cb(call) { return new Promise(function (ok, ko) { call(ok, ko); }); }
function sendReport(body, ms) {
  return screenRequest('POST', '/probe', body, ms || 10000).then(function (result) {
    if (!result || result.ok !== true) throw new Error('Report rejected');
    return {status: 200, persisted: result.persisted};
  });
}
function readScreen(live) {
  return screenRequest('GET', live ? '/screen?live=1' : '/screen', undefined, live ? 4000 : 12000).then(function (data) {
    if (!data || data.error || !data.root || typeof data.root.connected !== 'boolean' || !data.input ||
        typeof data.input.enabled !== 'boolean' || typeof data.input.connected !== 'boolean' || !data.launcher) throw new Error('Invalid screen status');
    return data;
  });
}
function pollScreen() {
  if (leaving || document.hidden || running || liveBusy) return Promise.resolve();
  liveBusy = true;
  var epoch = screenEpoch;
  function current() { return !leaving && !document.hidden && !running && epoch === screenEpoch; }
  return readScreen(!!lastScreen).then(function (data) {
    if (!current()) return;
    if (lastScreen && lastScreen.launcher && lastScreen.launcher.enabled === data.launcher.enabled &&
        lastScreen.launcher.failures === data.launcher.failures && lastScreen.root.connected === data.root.connected) data.launcher = lastScreen.launcher;
    lastScreen = data; liveError = false; render(data, false);
  }, function () { if (current()) { liveError = true; render(null, false); } }).then(function () { liveBusy = false; });
}
function tryConnect(port) {
  return new Promise(function (resolve, reject) {
    var ws = new WebSocket('ws://127.0.0.1:' + port + '/api/v2/channels/samsung.remote.control?name=' + btoa('Vetro'));
    var done = false, t = setTimeout(function () { finish(new Error('timeout')); }, 4000);
    var forget = trackScreenTask(function () { finish(new Error('Screen is closing')); });
    function finish(error) { if (done) return; done = true; clearTimeout(t); forget(); try { ws.close(); } catch (e) {} if (error) reject(error); else resolve('open'); }

}

// closed early still leaves the TV named in the report (#101). From then on every step sends what it has. The package
// list is the slow one (#83, #94, #104): it is read after the verdict, so it can no longer hold the screen on "Checking".
// Each entry: name, call, time limit (ms), what the screen calls the step.
var jobs = [
  ['serviceLaunch', launchService, 8000, 'Starting the service'],
  ['tizenObject', function () { return typeof tizen !== 'undefined'; }, 8000, 'Tizen API'],
  ['webapisObject', function () { return typeof webapis !== 'undefined'; }, 8000, 'Samsung API'],
  ['productinfo', function () {
      ['getModel', 'getRealModel', 'getFirmware', 'getModelCode', 'getLocalSet', 'getSmartTVServerType'].forEach(function (m) {
        var id = {getModel: 'model', getRealModel: 'realModel', getFirmware: 'firmware', getModelCode: 'modelCode',
          getLocalSet: 'localSet', getSmartTVServerType: 'smartHubServer'}[m];
        try { report.settings[id] = webapis.productinfo[m](); } catch (e) {}
      });
      // Tizen platform version ("6.5", "9.0", ...). Public API, no root needed; absent or refused on some firmware.
      try {
        var pv = tizen.systeminfo.getCapability('http://tizen.org/feature/platform.version');
        if (typeof pv === 'string' && pv) report.settings.platformVersion = pv;
      } catch (e) {}
      return Object.keys(report.settings).length; }, 8000, 'Model and firmware'],
  ['supportedKeys', function () { return tizen.tvinputdevice.getSupportedKeys().map(function (k) { return k.name; }); }, 8000, 'Remote keys'],
  ['serviceReach', function () { return reach(8); }, 25000, 'Service answer'],
  ['remoteApi8001', function () { return tryConnect(8001); }, 8000, 'TV remote API'],
  ['systeminfoBattery', function () { return cb(function (ok, ko) { tizen.systeminfo.getPropertyValue('BUILD', ok, ko); }); }, 8000, 'System info'],
  ['apps', function () { var mine = report, epoch = screenEpoch; return cb(function (ok, ko) { tizen.application.getAppsInfo(ok, ko); }).then(function (a) {
      if (leaving || report !== mine || epoch !== screenEpoch) return;
      report.apps = a.map(function (x) { return {id: x.id, name: x.name, packageId: x.packageId, show: x.show}; });
      return a.length; }); }, 8000, 'Installed apps']
];
var EARLY = 6;   // Full diagnostics publish as soon as the service answers.
var QUICK_NAMES = ['serviceLaunch', 'tizenObject', 'webapisObject', 'productinfo', 'serviceReach'];
var activeJobs = jobs;
var later = ['packages', function () { var mine = report, epoch = screenEpoch; return cb(function (ok, ko) { tizen.package.getPackagesInfo(ok, ko); }).then(function (p) {
    if (leaving || report !== mine || epoch !== screenEpoch) return;
    report.packages = p.map(function (x) { return {id: x.id, version: x.version, totalSize: x.totalSize, author: x.author}; });
    return p.length; }); }, 30000, 'Package list'];
var LABELS = {};
jobs.concat([later]).forEach(function (j) { LABELS[j[0]] = j[3]; });

// ---- the screen -------------------------------------------------------------------------------------------
var ICONS = {
  ok: '<svg class="ic" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#7fcba0" stroke-width="3"/><path d="M11.5 20.5l6 6 11-12.5" fill="none" stroke="#7fcba0" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn: '<svg class="ic" viewBox="0 0 40 40"><path d="M20 4.5l17 29.5H3z" fill="none" stroke="#e2b867" stroke-width="3" stroke-linejoin="round"/><path d="M20 15v9" stroke="#e2b867" stroke-width="3.6" stroke-linecap="round"/><circle cx="20" cy="29" r="2.1" fill="#e2b867"/></svg>',
  bad: '<svg class="ic" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#ef8a80" stroke-width="3"/><path d="M13.5 13.5l13 13M26.5 13.5l-13 13" stroke="#ef8a80" stroke-width="3.6" stroke-linecap="round"/></svg>',
  na: '<svg class="ic" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#aab8d1" stroke-width="3" stroke-dasharray="5 5"/></svg>',
  wait: '<svg class="ic" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#aab8d1" stroke-width="3" stroke-dasharray="5 5"/></svg>',
  off: '<svg class="ic" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#aab8d1" stroke-width="3"/><path d="M12 20h16" stroke="#aab8d1" stroke-width="3.6" stroke-linecap="round"/></svg>'
};
function esc(v) { return String(v).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }
function probeOk(name) { return !!(report.probe[name] && report.probe[name].ok); }
// Steps that ran out of time, or were skipped because the whole check did. A slow service start does not count once the
// service has answered: on some TVs the start call never reports back although the service runs.
function slowSteps() {
  return Object.keys(report.probe).filter(function (k) {
    var p = report.probe[k];
    if (k === 'serviceLaunch' && probeOk('serviceReach')) return false;
    return p && !p.ok && /^(no answer|skipped)/.test(String(p.error || ''));

// Why the service is down, for the support line: what the start and the reach steps said (#2).
function svcWhy() {
  var why = [];
  [['serviceLaunch', 'start'], ['serviceReach', 'reach']].forEach(function (s) {
    var p = report.probe[s[0]];
    if (p && !p.ok) why.push(s[1] + ': ' + String(p.error || 'failed').slice(0, 60));

function appVersion() { try { return tizen.application.getCurrentApplication().appInfo.version || null; } catch (e) { return null; } }

// Root not connected: what the service saw decides what the screen asks for (#99, #91, #75). A cold start is what made
// the agent connect on the TVs we heard from; reinstalling does not help a TV that cannot run it.
var COLD = 'turn the TV off at the wall (or unplug it) for 30 seconds, then on again';
function rootCheck(r) {

  if (r.reason === 'starting') return ['warn', 'Root access', 'Connecting', 'Root usually connects within a minute of the TV starting. Press OK to check again.', 'ROOT WAIT', 'warn'];
  if (r.reason === 'sdb') return ['bad', 'Root access', 'Not connected', 'The TV refused the local developer connection root needs. Check that Developer Mode is on and Host PC IP is 127.0.0.1, then ' + COLD + '.', 'ROOT DOWN' + code, 'bad'];
  if (r.reason === 'agent') return ['bad', 'Root access', 'Not connected', 'The root helper started but did not answer. Check that Host PC IP is 127.0.0.1, then ' + COLD + '. If it stays like this, reinstall the root package.', 'ROOT DOWN agent', 'bad'];
  if (r.reason === 'prepare') return ['bad', 'Root access', 'Not connected', 'Vetro could not prepare the root helper. Reinstall the root package.', 'ROOT DOWN prepare', 'bad'];

// One check: [state, name, value, hint, token, tokenState]. state is ok | warn | bad | off | na. The token is the

    out.push(['bad', 'Service', 'Not answering', 'Vetro\'s background service did not answer on port 8099. Close this screen and open Vetro again; if it stays like this, reinstall Vetro.' +

  } else {
    var av = appVersion(), mismatch = av && d.version && av !== d.version;
    out.push(mismatch ? ['warn', 'Service', 'Version differs', 'The app is ' + esc(av) + ' and the service is ' + esc(d.version) + '. Reinstall Vetro so both match.', 'SVC ' + d.version + '/APP ' + av, 'warn']
      : ['ok', 'Service', 'Running', 'Port ' + esc(d.port), 'svc ok']);
  }
  if (!d) out.push(['na', 'Root access', 'Unknown', null, 'root ?']);
  else if (d.root.connected) out.push(['ok', 'Root access', 'Connected', null, 'root ok']);
  else if (d.root.mode === 'app-only') out.push(['warn', 'Root access', 'Not available', 'This is the app-only package. Features that need root are off.', 'ROOT NO', 'warn']);
  else out.push(rootCheck(d.root));

  else if (!d.input.enabled) out.push(['off', 'Remote input', 'Off', null, 'input off']);
  else if (d.input.connected) out.push(['ok', 'Remote input', 'Filtering', null, 'input ok']);
  else out.push(['bad', 'Remote input', 'Remote input disconnected', 'The saved remote is not connected. Open Remote in the dashboard.', 'INPUT LOST', 'bad']);
  l = d && d.launcher;
  if (!d) out.push(['na', 'Launcher', 'Unknown', null, 'launcher ?']);
  else if (!l.installed) out.push(['na', 'Launcher', 'Not included', null, 'launcher n/a']);
  else if (!l.enabled) out.push(['off', 'Launcher', 'Off', null, 'launcher off']);
  else if (l.running === true) out.push(['ok', 'Launcher', 'Running', null, 'launcher ok']);

  else if (apiMissing.length) api = ['warn', 'TV APIs', 'Limited', 'Not available: ' + esc(apiMissing.join(', ')) + '.' + (slowHint ? ' ' + slowHint : ''), 'API ' + apiMissing.join('/') + (slow.length ? ' SLOW ' + slow.join('/') : ''), 'warn'];
  // A slow step whose answer Vetro does not need is named, without turning a healthy TV into a warning.
  else if (slow.length) api = ['ok', 'TV APIs', 'Available', 'slow: ' + esc(slow.map(function (k) { return LABELS[k] || k; }).join(', ')), 'api ok, slow ' + slow.join('/')];
  else api = ['ok', 'TV APIs', 'Available', report.probe.packages ? null : 'package list: reading', 'api ok'];
  out.push(api);
  mem = d && d.memory && d.memory.availableMb;
  if (typeof mem !== 'number') out.push(['na', 'Memory', 'Unknown', null, 'mem ?']);
  else if (mem < 200) out.push(['warn', 'Memory', mem + ' MB free', 'Low. The TV may feel slow.', 'MEM ' + mem + 'M', 'warn']);
  else out.push(['ok', 'Memory', mem + ' MB free', null, 'mem ' + mem + 'M']);
  return out;
}

function cell(c) {
  var cls = c[0] === 'bad' || c[0] === 'warn' || c[0] === 'na' || c[0] === 'wait' ? ' ' + c[0] : '';
  var value = esc(c[2]) + (c[3] && c[0] === 'ok' ? ' <span>&middot; ' + c[3] + '</span>' : '');
  return '<div class="c' + cls + '">' + ICONS[c[0]] + '<div><div class="n">' + esc(c[1]) + '</div><div class="v">' + value + '</div>' +
    (c[3] && c[0] !== 'ok' ? '<div class="h">' + c[3] + '</div>' : '') + '</div></div>';
}

var WAITING = [['Service', 'Starting'], ['Root access', 'Checking'], ['Remote input', 'Checking'], ['Launcher', 'Checking'], ['TV APIs', 'Checking'], ['Memory', 'Checking']];
function render(d, waiting) {
  if (leaving) return;
  var list = waiting ? WAITING.map(function (w) { return ['wait', w[0], w[1], null, '']; }) : checks(d), bad = 0, warn = 0, state, label, sum, device = report.settings, model, firmware, line, version, pin = pairing ? pairing.code.slice(0, 3) + ' ' + pairing.code.slice(3) : '';
  list.forEach(function (c) { if (waiting) return; if (c[0] === 'bad') bad++; else if (c[0] === 'warn') warn++; });
  if (waiting) { state = 'wait'; label = 'Checking'; sum = 'Checking'; }
  else if (!d) { state = 'bad'; label = 'Not responding'; sum = liveError ? 'Status update unavailable' : 'The service is down'; }
  else if (bad) { state = 'bad'; label = 'Needs attention'; sum = bad + (bad === 1 ? ' problem' : ' problems'); }
  else if (warn) { state = 'warn'; label = 'Running, with limits'; sum = warn + (warn === 1 ? ' thing to check' : ' things to check'); }
  else { state = 'ok'; label = 'Running in the background'; sum = 'All good. You can close this screen, Vetro keeps running without it.'; }
  version = (d && d.version) || appVersion();
  model = device.realModel || device.model;
  firmware = device.firmware ? String(device.firmware).split('-').pop() : null;   // T-NKM2DEUC-2310.0 -> 2310.0
  line = [esc('V' + (version || '?'))].concat(model ? [esc(model + (firmware ? ' ' + firmware : ''))] : []);
  if (!waiting) list.forEach(function (c) { line.push(c[5] ? '<em' + (c[5] === 'warn' ? ' class="w"' : '') + '>' + esc(c[4]) + '</em>' : esc(c[4])); });
  var addr = d && d.address ? 'http://' + d.address + ':' + d.port : null;
  var cells = '';
  list.forEach(function (c) { cells += cell(c); });
  document.getElementById('screen').innerHTML =
    '<div class="hero"><img src="' + ICON + '" alt="Vetro"><div><h1>Vetro</h1><div class="meta">' +
    (version ? 'Version ' + esc(version) : '') + (model ? ' &middot; ' + esc(model) : '') + (firmware ? ' &middot; firmware ' + esc(firmware) : '') +
    '</div><div class="state ' + (state === 'ok' ? '' : state) + '">' + ICONS[state] + esc(label) + '</div></div>' +
    '<div class="dash"><div class="dh"><small>DASHBOARD</small><div class="pin" id="pin"' + (pin ? '' : ' hidden') + '>PIN<b>' + esc(pin) + '</b><i>' + esc(pairing ? pinLine() : '') + '</i></div></div>' +
    '<div class="url' + (addr ? '' : ' off') + '">' + (addr ? esc(addr) : 'Address unavailable') + '</div>' +
    '<p>' + (addr ? 'Open it on a phone or computer on the same network.' : waiting ? 'Vetro is checking the TV. Pairing is available as soon as the service answers.' : 'Dashboard at <code>http://&lt;TV&gt;:8099/</code> once the service answers (use the TV address from your router).') + '</p></div></div>' +
    '<div class="panel ' + (bad ? 'bad' : warn ? 'warn' : '') + '"><div class="ph"><h2>Diagnostics</h2><div class="sum ' + (state === 'ok' ? '' : state) + '" id="sum">' + esc(sum) + '</div></div>' +
    '<div class="grid">' + cells + '</div>' +
    '<div class="share"><div class="t">Asking for help? Read out or photograph this line.</div><code>' + (waiting ? 'Collecting the details&hellip;' : line.join(' &middot; ')) + '</code></div>' +
    '<div class="keys">' + (waiting ? '' : '<span><i>OK</i>Full diagnostics</span>') + '<span><i>Back</i>Close</span></div></div>';
}
function fit() {
  var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080), s = document.getElementById('stage');
  if (s && s.style) s.style.transform = 'scale(' + k + ')';
}

// ---- run ----------------------------------------------------------------------------------------------------
// Asks the service every 2 s whether a browser is waiting to pair; only loopback may read the code.
function pinLine() {
  var left = Math.max(0, Math.ceil((pairing.until - Date.now()) / 1000));
  return pairing.name + ' · ' + Math.floor(left / 60) + ':' + (left % 60 < 10 ? '0' : '') + left % 60;
}
function paintPairing() {
  var el = document.getElementById('pin');
  if (pairing && pairing.until <= Date.now()) pairing = null;   // a lost answer must not leave a dead code on screen
  if (!el) return;
  el.hidden = !pairing;
  el.innerHTML = 'PIN<b>' + (pairing ? esc(pairing.code.slice(0, 3) + ' ' + pairing.code.slice(3)) : '') + '</b><i>' + esc(pairing ? pinLine() : '') + '</i>';
}
function showPairing(p) {
  var was = pairing && pairing.code;
  pairing = p && p.code ? {code: String(p.code), name: String(p.name || 'Browser'), until: Date.now() + (+p.expiresIn || 120) * 1000} : null;
  if (pairing) resetIdle();                       // the screen stays open while a code is waiting
  if (!pairing && !was) return;
  paintPairing();
}
function checkPairing() {
  if (leaving || document.hidden || pairingBusy) return Promise.resolve();
  pairingBusy = true;
  var epoch = screenEpoch;
  return screenRequest('GET', '/auth/pending', undefined, 3000).then(function (data) {
    if (!leaving && !document.hidden && epoch === screenEpoch) showPairing(data);
  }, function () {}).then(function () { pairingBusy = false; });
}
function resetIdle() {
  if (leaving) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(leave, IDLE_MS);
}
// Shows how far the checks are, so a slow TV reads as working and not as stuck: the step, its name and its seconds.
// Seconds that stop moving mean the page itself is blocked; a photo of this line says where.
function progress(n, label) {
  step = {n: n, label: label, since: Date.now()};
  paintProgress();
}
function paintProgress() {
  var el = document.getElementById('sum');
  if (el && step) el.textContent = 'Checking ' + step.n + ' of ' + activeJobs.length + ' \u00b7 ' + step.label + ' \u00b7 ' + Math.floor((Date.now() - step.since) / 1000) + ' s';
}
// Reports go out one after the other, each as it was when queued, so a late answer cannot overwrite a newer one.
function post(ms) {
  var body = JSON.stringify(report), sent = posts.then(function () { if (!leaving) return sendReport(body, ms); });
  posts = sent.then(null, function () {});
  return sent;
}
function run(full) {
  if (leaving || running) return Promise.resolve();
  fullCheck = full === true; activeJobs = fullCheck ? jobs : jobs.filter(function (job) { return QUICK_NAMES.indexOf(job[0]) !== -1; });
  running = true; delivered = false; liveError = false; screenEpoch++;
  var epoch = screenEpoch, selected = activeJobs;
  var started = Date.now(), closed = false, cap;
  report = {probe: {}, apps: [], packages: [], settings: {}, progress: {partial: true, done: 0, of: selected.length, next: selected[0][0], elapsedMs: 0}};
  render(null, true);
  checkPairing();
  clearInterval(tick);
  tick = setInterval(paintProgress, 1000);
  var steps = selected.reduce(function (p, j, i) {
    return p.then(function () {
      if (closed || leaving) return;
      progress(i + 1, j[3]);
      return attempt(j[0], j[1], j[2]).then(function () {
        if (closed || leaving) return;
        report.progress = {partial: true, done: i + 1, of: selected.length, next: (selected[i + 1] || (fullCheck ? later : ['complete']))[0], elapsedMs: Date.now() - started};
        if (i + 1 >= EARLY && i + 1 < selected.length && probeOk('serviceReach')) post(4000).then(null, function () {});
      });
    });
  }, Promise.resolve());
  var forgetLimit;
  var limit = new Promise(function (resolve) {
    function finish() { closed = true; clearTimeout(cap); resolve(); }
    cap = setTimeout(finish, fullCheck ? TOTAL_MS : 45000); forgetLimit = trackScreenTask(finish);
  });
  return Promise.race([steps, limit])
    .then(function () {
      var done = 0;
      closed = true; clearTimeout(cap); forgetLimit(); clearInterval(tick); step = null;
      if (leaving || epoch !== screenEpoch) return;
      selected.forEach(function (j) {
        if (!report.probe[j[0]]) report.probe[j[0]] = {ok: false, error: 'skipped: the checks took over ' + (fullCheck ? TOTAL_MS : 45000) / 1000 + ' s'};
        if (!/^skipped/.test(String(report.probe[j[0]].error || ''))) done++;
      });
      report.progress = {partial: false, done: done, of: selected.length, next: fullCheck ? later[0] : 'complete', elapsedMs: Date.now() - started};
      return post(10000).then(function () { if (!leaving && epoch === screenEpoch) delivered = true; }, function () {});
    })
    .then(function () { if (!leaving && epoch === screenEpoch) return readScreen().catch(function () { return null; }); })
    .then(function (d) { if (!leaving && epoch === screenEpoch) { lastScreen = d; render(d, false); } }, function () { if (!leaving && epoch === screenEpoch) { lastScreen = null; render(null, false); } })
    .then(function () { running = false; if (!leaving && epoch === screenEpoch && fullCheck) readPackages(); });
}
// The package list, after the verdict. When it arrives the report goes out again and the screen is drawn again.
function readPackages() {
  if (leaving) return;
  if (packagesBusy) { packagesAgain = true; return; }
  packagesBusy = true;
  var mine = report;
  attempt(later[0], later[1], later[2]).then(function () {
    packagesBusy = false;
    if (packagesAgain) { packagesAgain = false; if (!running) return readPackages(); }
    if (leaving || running || report !== mine) return;
    report.progress.packagesDone = true;
    post(10000).then(null, function () {});
    render(lastScreen, false);
  });
}
document.addEventListener('visibilitychange', function () { if (document.hidden) { screenEpoch++; if (delivered && !pairing) leave(); } else if (!leaving) { checkPairing(); pollScreen(); } });
document.addEventListener('keydown', function (e) {
  if (leaving) return;
  var k = e && e.keyCode;
  resetIdle();
  if (k === 10009 || k === 27) leave();
  else if (k === 13) run(true);
});
window.addEventListener('resize', fit);
fit();
resetIdle();
startPolling();
// Module scripts run after this classic script and before DOMContentLoaded.
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { run(false); }); else run(false);
</script>
<script type="module">import { Service } from 'wrt:service'; window.a2sService = Service;</script>
