name: Home shortcut test package
on:
  push:
    branches: [build/launcher-home-shortcut]
    paths:
      - 'dock/**'
      - 'app/**'
      - '.github/workflows/launcher-home-shortcut-test-package.yml'
permissions:
  contents: write
concurrency:
  group: launcher-home-shortcut-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'pponce/vetro' && github.ref == 'refs/heads/build/launcher-home-shortcut'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Launcher regression tests
        run: dotnet run --project dock/tests/Launcher.Tests.csproj --configuration Release
      - name: Verify regression catches a stale Home close
        shell: python
        run: |
          import os, pathlib, shutil, subprocess
          fixture = pathlib.Path(os.environ["RUNNER_TEMP"]) / "vetro-home-guard-regression"
          shutil.copytree("dock/src/Core", fixture / "src/Core")
          shutil.copytree("dock/tests", fixture / "tests", ignore=shutil.ignore_patterns("bin", "obj"))
          guard = fixture / "src/Core/HomeCloseGuard.cs"
          source = guard.read_text()
          cancel = "            _next = CloseTimes.Length;"
          assert source.count(cancel) == 1
          guard.write_text(source.replace(cancel, "            // Mutation: keep pending closes after an explicit launch."))
          result = subprocess.run(["dotnet", "run", "--project", str(fixture / "tests/Launcher.Tests.csproj"),
              "--configuration", "Release"], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print(result.stdout)
          assert result.returncode != 0, "Regression must reject stale Home closes"
          assert "FAIL: newly opened Home cannot be closed by a pending retry" in result.stdout
          print("PASS: the regression detects a stale Home-close retry")
      - name: Compile TV launcher
        run: |
          dotnet build dock/Launcher.csproj --configuration Release -p:UseAppHost=false
          cp dock/bin/Release/netcoreapp3.1/tvlauncher-dotnet.dll app/native/dock/tvlauncher-dotnet.dll
      - name: Application and integration checks
        run: |
          node app/tests/run.cjs
          node rooting/tests/run.cjs
          python3 .github/scripts/test_parse_log.py
          python3 .github/scripts/audit_release.py
      - name: Save compiled launcher on the build branch
        env:
          BUILD_BRANCH: build/launcher-home-shortcut
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/native/dock/tvlauncher-dotnet.dll
          if git diff --cached --quiet; then
            echo 'Compiled launcher already matches the branch.'
          else
            git commit -m 'Build launcher with cancellable Home suppression'
            git push origin HEAD:"$BUILD_BRANCH"
          fi
      - name: Package unsigned TV integration
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = require('./app/build.cjs');
          const integration = require('./rooting/build.cjs');
          fs.mkdirSync('dist', {recursive: true});
          const output = 'dist/vetro-home-shortcut-unsigned.wgt';
          fs.writeFileSync(output, app.zip(integration.collectIntegration()));
          console.log('Unsigned TV integration package: ' + output);
          NODE
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          sha256sum dist/vetro-home-shortcut-unsigned.wgt > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vetro-home-shortcut-unsigned
          path: |
            dist/vetro-home-shortcut-unsigned.wgt
            dist/SOURCE_COMMIT.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
