name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Application tests
        run: node app/tests/run.cjs
      - name: Integration fixtures
        run: node rooting/tests/run.cjs
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x
      - name: Root launcher settings IPC tests
        run: |
          dotnet build -c Release dock/settings-tests/Launcher.SettingsTests.csproj
          sudo "$(command -v dotnet)" dock/settings-tests/bin/Release/net10.0/tvlauncher-dotnet.dll
      - name: Direct Home input and FIFO tests
        run: dotnet run -c Release --project rooting/tests/direct-home
      - name: Compile remote input helper
        run: dotnet build rooting/remote-input-build/RemoteInput.csproj -c Release -p:UseAppHost=false
      - name: Native launcher checks
        run: dotnet run -c Release --project dock/tests
      - name: Install Ecore test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libecore1
      - name: Ecore child completion tests
        env:
          ECORE_NO_SYSTEM_MODULES: "1"
        run: dotnet run -c Release --project dock/native-tests
      - name: Compile TV launcher from source
        run: dotnet build dock/Launcher.csproj -c Release -p:UseAppHost=false
      - name: Diagnostic parser tests
        run: python3 .github/scripts/test_parse_log.py
      - name: Release hygiene and architecture
        run: python3 .github/scripts/audit_release.py
      - name: Package the rebuilt integration for testing
        if: github.repository == 'pponce/vetro'
        env:
          VETRO_SOURCE_REVISION: ${{ github.sha }}
        run: |
          cp rooting/remote-input-build/bin/Release/netcoreapp3.1/SamsungTvRemoteInputAgent.{dll,deps.json,runtimeconfig.json} rooting/payload/
          cp dock/bin/Release/netcoreapp3.1/tvlauncher-dotnet.dll app/native/dock/tvlauncher-dotnet.dll
          node - <<'NODE'
          const fs = require('fs'), crypto = require('crypto');
          const builder = require('./app/build.cjs');
          const files = require('./rooting/build.cjs').collectIntegration();
          const names = files.map(f => decodeURIComponent(f.uri));
          for (const name of ['service/home-double-press.js', 'service/plugin-launcher.js', 'service/root-agent.js', 'native/dock/tvlauncher-dotnet.dll', 'payload/SamsungTvRemoteInputAgent.dll', 'payload/SamsungTvRemoteInputAgent.runtimeconfig.json']) {
            if (!names.includes(name)) throw Error('Missing integration file: ' + name);
          }
          fs.mkdirSync('dist', {recursive:true});
          fs.writeFileSync('dist/vetro-0.5.0-home-enhancements-unsigned.wgt', builder.zip(files));
          fs.writeFileSync('dist/SOURCE_COMMIT.txt', process.env.VETRO_SOURCE_REVISION + '\n');
          fs.writeFileSync('dist/LAUNCHER_SHA256.txt', crypto.createHash('sha256').update(fs.readFileSync('app/native/dock/tvlauncher-dotnet.dll')).digest('hex') + '\n');
          NODE
          sha256sum dist/*.wgt > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.repository == 'pponce/vetro'
        with:
          name: vetro-0.5.0-home-enhancements-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 30

