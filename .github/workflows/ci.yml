name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Application tests
        run: node app/tests/run.cjs
      - name: Integration fixtures
        run: node rooting/tests/run.cjs
      - name: Diagnostic parser tests
        run: python3 .github/scripts/test_parse_log.py
      - name: Combined installer checks
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 tools/tv-updater/bundle.py
      - name: Release hygiene and architecture
        run: python3 .github/scripts/audit_release.py
  permissions_ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/vetro-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/vetro-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Permission settings interaction and responsive layout
        env:
          VETRO_PREVIEW_DIR: ${{ runner.temp }}/vetro-permissions-preview
        run: NODE_PATH="$RUNNER_TEMP/vetro-browser/node_modules" node app/tests/app-access-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vetro-permissions-preview
          path: ${{ runner.temp }}/vetro-permissions-preview
          if-no-files-found: error
          retention-days: 14
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Launcher tests
        run: dotnet run --project dock/tests/Launcher.Tests.csproj --configuration Release
      - name: Install Ecore test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libecore1
      - name: Native Ecore process and repeated Home tests
        env:
          ECORE_NO_SYSTEM_MODULES: '1'
        run: dotnet run --project dock/native-tests/Launcher.NativeTests.csproj --configuration Release
      - name: Compile TV launcher
        run: dotnet build dock/Launcher.csproj --configuration Release -p:UseAppHost=false
      - name: Headless launcher control and privilege boundary
        run: sudo env DOTNET_ROLL_FORWARD=Major python3 dock/control-tests/test_control.py "$(command -v dotnet)" dock/bin/Release/netcoreapp3.1/tvlauncher-dotnet.dll
      - name: TV updater and local-SDB tests
        run: |
          dotnet run --project tools/tv-updater/tests/Tests.csproj --configuration Release > "$RUNNER_TEMP/vetro-helper-tests.log"
          cat "$RUNNER_TEMP/vetro-helper-tests.log"
          python3 tools/tests/check_helper_contract.py "$RUNNER_TEMP/vetro-helper-tests.log"
      - name: Compile TV updater
        run: dotnet build tools/tv-updater/VetroUpdate.csproj --configuration Release
  combined_package:
    if: github.repository == 'pponce/vetro' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/combined/startup-return-launcher' || github.ref == 'refs/heads/combined/permissions-startup-return' || github.ref == 'refs/heads/combined/runtime-wrapper-observation-20261103' || github.ref == 'refs/heads/feat/home-double-press')
    needs: [check, launcher, permissions_ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build full unsigned combined package
        env:
          VETRO_CONNECTION_DIAGNOSTICS: ${{ (github.ref == 'refs/heads/combined/runtime-wrapper-observation-20261103' || github.ref == 'refs/heads/feat/home-double-press') && '1' || '0' }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = require('./app/build.cjs');
          const integration = require('./rooting/build.cjs');
          const files = integration.collectIntegration();
          const names = files.map(f => decodeURIComponent(f.uri));
          for (const name of ['service/startup-app.js', 'service/return-app.js', 'service/return-navigation.js', 'service/home-routing.js', 'service/root-agent.js', 'native/dock/tvlauncher-dotnet.dll']) {
            if (!names.includes(name)) throw Error('Missing combined package file: ' + name);
          }
          const launcher = files.find(f => decodeURIComponent(f.uri) === 'native/dock/tvlauncher-dotnet.dll');
          if (!launcher.data.includes(Buffer.from('--mapped-home', 'utf16le'))) {
            throw Error('The packaged launcher must be rebuilt for shared Home routing');
          }
          if (!launcher.data.includes(Buffer.from('VETRO_NAV_V1', 'utf16le'))) throw Error('The packaged launcher must be rebuilt for navigation coordination');
          console.log('Launcher SHA256: ' + require('crypto').createHash('sha256').update(launcher.data).digest('hex'));
          fs.mkdirSync('dist', {recursive:true});
          fs.writeFileSync('dist/vetro-combined-unsigned.wgt', app.zip(files));
          NODE
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          sha256sum dist/vetro-combined-unsigned.wgt > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vetro-combined-unsigned
          path: |
            dist/vetro-combined-unsigned.wgt
            dist/SOURCE_COMMIT.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
