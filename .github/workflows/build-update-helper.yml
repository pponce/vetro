name: Compile combined update helper
on:
  push:
    branches: [combined/startup-return-launcher]
    paths:
      - tools/tv-updater/*.cs
      - tools/tv-updater/*.csproj
      - tools/tv-updater/bundle.py
      - tools/tv-updater/tests/**
      - .github/workflows/build-update-helper.yml
permissions:
  contents: read
jobs:
  helper:
    if: github.repository == 'pponce/vetro'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.100'
      - name: Test helper and SDB wire protocol
        run: dotnet run --project tools/tv-updater/tests/Tests.csproj --configuration Release
      - name: Compile TV helper
        run: |
          dotnet build tools/tv-updater/VetroUpdate.csproj --configuration Release
          python3 tools/tv-updater/bundle.py --write tools/tv-updater/bin/Release/netcoreapp3.1
      - name: Commit only the compiled helper on the combined branch
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git add -f tools/tv-updater/compiled/VetroUpdate.dll tools/tv-updater/compiled/VetroUpdate.runtimeconfig.json tools/tv-updater/compiled/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: compile standalone TV update helper'
          # A normal fast-forward push fails if somebody advanced the branch.
          git push origin HEAD:refs/heads/combined/startup-return-launcher
